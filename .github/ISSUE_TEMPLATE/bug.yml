name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This project is alpha. Search existing issues first.
        **Security problems:** do not use this form — report them via [Security advisories](https://github.com/lufzle/lemul/security/advisories/new).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: SHA on main
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      render: text
